# Publishes the landing page and the PDF via GitLab Pages (framagit).
# The PDF is built locally (the TeX toolchain is too heavy to run in CI);
# main.pdf is deliberately kept OUT of the repository, so this job uses the
# `artifacts: export` form of the `pages` job: files produced by the job's
# script are served as Pages without committing them to git.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp main.pdf public/
    - cp index.html public/
    - cp VERIFICATION.md public/VERIFICATION.txt
  artifacts:
    paths:
      - public
    export:
      - main.pdf
      - index.html
      - VERIFICATION.txt
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
