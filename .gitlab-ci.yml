# Publishes main.pdf and the landing page via GitLab Pages (framagit).
# The PDF is built locally (latexmk toolchain is heavy for CI); this job
# only ships the current committed build artifacts.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp main.pdf public/
    - cp index.html public/
    - cp VERIFICATION.md public/VERIFICATION.txt
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
